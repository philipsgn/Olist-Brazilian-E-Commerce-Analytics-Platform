name: Production Data Pipeline CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-test:
    name: CI - Lint and dbt Compile
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: de_user
          POSTGRES_PASSWORD: de_password
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_user -d ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_PROFILES_DIR: ./dbt_project
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: ecommerce_db
      POSTGRES_AIRFLOW_DB: airflow
      POSTGRES_SUPERSET_DB: superset
      RDS_HOST: localhost
      RDS_PORT: 5432
      RDS_USER: de_user
      RDS_PASSWORD: de_password
      RDS_DB: ecommerce_db
      ENVIRONMENT: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install SQL Linting Dependencies
        run: pip install sqlfluff sqlfluff-templater-dbt

      - name: SQL Linting
        run: sqlfluff lint dbt_project/ecommerce/models --dialect postgres

      - name: Install dbt Dependencies
        run: |
          pip install dbt-core dbt-postgres
          dbt deps --project-dir ./dbt_project/ecommerce

      - name: dbt Debug
        run: dbt debug --project-dir ./dbt_project/ecommerce --target dev

      - name: dbt Compile
        run: dbt compile --project-dir ./dbt_project/ecommerce --target dev
