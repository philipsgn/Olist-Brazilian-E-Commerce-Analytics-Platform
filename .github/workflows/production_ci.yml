name: Production Data Pipeline CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-test:
    name: CI - Lint and dbt Compile
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: de_user
          POSTGRES_PASSWORD: de_password
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_user -d ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_PROFILES_DIR: ./dbt_project
      DBT_DEV_HOST: localhost
      DBT_DEV_PORT: 5432
      DBT_DEV_USER: de_user
      DBT_DEV_PASSWORD: de_password
      DBT_DEV_DBNAME: ecommerce_db
      DBT_DEV_SCHEMA: analytics_ci
      ENVIRONMENT: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install SQL Linting Dependencies
        run: pip install sqlfluff sqlfluff-templater-dbt

      - name: SQL Linting
        run: sqlfluff lint dbt_project/ecommerce/models --dialect postgres

      - name: Install dbt Dependencies
        run: |
          pip install dbt-core dbt-postgres
          dbt deps --project-dir ./dbt_project/ecommerce

      - name: dbt Debug
        run: dbt debug --project-dir ./dbt_project/ecommerce --target dev

      - name: dbt Compile
        run: dbt compile --project-dir ./dbt_project/ecommerce --target dev

  deploy:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci-test
    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Deployment Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "${EC2_HOST}" || { echo "ERROR: EC2_HOST secret is empty."; exit 1; }
          test -n "${EC2_USER}" || { echo "ERROR: EC2_USER secret is empty."; exit 1; }
          test -n "${EC2_SSH_KEY}" || { echo "ERROR: EC2_SSH_KEY secret is empty."; exit 1; }

      - name: Package Project for EC2
        run: |
          STAGING_DIR="$(mktemp -d)"
          ARCHIVE_PATH="${RUNNER_TEMP}/deploy.tar.gz"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.pytest_cache/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.venv/' \
            --exclude='*.log' \
            --exclude='airflow/logs/' \
            --exclude='dbt_project/ecommerce/logs/' \
            --exclude='dbt_project/ecommerce/target/' \
            --exclude='dbt_project/ecommerce/dbt_packages/' \
            --exclude='logs/' \
            --exclude='tmp/' \
            --exclude='postgres_data/' \
            --exclude='deploy.tar.gz' \
            ./ "${STAGING_DIR}/"

          tar -czf "${ARCHIVE_PATH}" -C "${STAGING_DIR}" .
          rm -rf "${STAGING_DIR}"
          cp "${ARCHIVE_PATH}" ./deploy.tar.gz

      - name: Preflight SSH Reachability
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Checking TCP reachability to ${EC2_HOST}:22 ..."
          if ! timeout 20 bash -c "</dev/tcp/${EC2_HOST}/22"; then
            echo "ERROR: GitHub runner cannot reach ${EC2_HOST}:22."
            echo "Verify EC2 is running, has a public IP or reachable route, and Security Group/NACL allow SSH from GitHub-hosted runners."
            exit 1
          fi
          echo "SSH port is reachable."

      - name: Copy Release Bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.EC2_USER }}/"
          timeout: 2m
          command_timeout: 20m
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 2m
          command_timeout: 30m
          script: |
            set -euo pipefail

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/Olist-Brazilian-E-Commerce-Analytics-Platform"
            ARCHIVE_PATH="/home/${{ secrets.EC2_USER }}/deploy.tar.gz"
            RELEASE_DIR="/home/${{ secrets.EC2_USER }}/deploy_release"

            echo "Preparing release directory: ${PROJECT_DIR}"
            mkdir -p "${PROJECT_DIR}"
            rm -rf "${RELEASE_DIR}"
            mkdir -p "${RELEASE_DIR}"

            echo "Extracting release bundle..."
            tar -xzf "${ARCHIVE_PATH}" -C "${RELEASE_DIR}"
            rm -f "${ARCHIVE_PATH}"

            if ! command -v rsync >/dev/null 2>&1; then
              echo "ERROR: rsync is required on EC2 for clean deployments."
              exit 1
            fi

            echo "Syncing release into project directory..."
            rsync -a --delete \
              --exclude='.env' \
              --exclude='airflow/logs/' \
              --exclude='dbt_project/ecommerce/dbt_packages/' \
              --exclude='superset_home/' \
              --exclude='tmp/' \
              "${RELEASE_DIR}/" "${PROJECT_DIR}/"
            rm -rf "${RELEASE_DIR}"
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} "${PROJECT_DIR}"

            cd "${PROJECT_DIR}"

            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: docker-compose.yml is missing from ${PROJECT_DIR}"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: .env must be pre-created on EC2 before deployment."
              exit 1
            fi

            set -a
            . ./.env
            set +a

            echo "Stopping previous stack..."
            sudo docker compose down --remove-orphans || true

            check_host_port_available() {
              local bind_address="$1"
              local host_port="$2"
              local service_name="$3"

              if [ -z "${host_port}" ]; then
                echo "Skipping ${service_name} port check because host port is empty."
                return 0
              fi

              if sudo ss -ltnp "( sport = :${host_port} )" | tail -n +2 | grep -q .; then
                echo "ERROR: ${service_name} cannot bind ${bind_address}:${host_port} because the port is already in use."
                echo "Listener details:"
                sudo ss -ltnp "( sport = :${host_port} )" || true
                echo "Docker containers publishing this port:"
                sudo docker ps --filter "publish=${host_port}" --format 'table {{.Names}}\t{{.Ports}}' || true
                return 1
              fi
            }

            check_host_port_available "${POSTGRES_BIND_ADDRESS:-127.0.0.1}" "${POSTGRES_HOST_PORT:-5433}" "postgres"
            check_host_port_available "${AIRFLOW_BIND_ADDRESS:-0.0.0.0}" "${AIRFLOW_WEBSERVER_HOST_PORT:-8080}" "airflow-webserver"
            check_host_port_available "${SUPERSET_BIND_ADDRESS:-0.0.0.0}" "${SUPERSET_HOST_PORT:-8088}" "superset"

            echo "Starting updated stack..."
            sudo docker compose up -d --build --remove-orphans

            echo "Current compose status:"
            sudo docker compose ps

            wait_for_healthy() {
              local container="$1"
              local timeout_seconds="$2"
              local waited=0

              while [ "${waited}" -lt "${timeout_seconds}" ]; do
                local status
                status="$(sudo docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "${container}" 2>/dev/null || true)"
                echo "${container} status: ${status}"

                if [ "${status}" = "running healthy" ]; then
                  return 0
                fi

                case "${status}" in
                  exited*|dead*)
                    echo "ERROR: ${container} exited before becoming healthy."
                    sudo docker logs --tail 100 "${container}" || true
                    return 1
                    ;;
                esac

                sleep 10
                waited=$((waited + 10))
              done

              echo "ERROR: ${container} did not reach 'running healthy' within ${timeout_seconds}s."
              sudo docker logs --tail 100 "${container}" || true
              return 1
            }

            wait_for_healthy de_airflow_webserver 240
            wait_for_healthy de_airflow_scheduler 240
            wait_for_healthy de_airflow_worker 240
            wait_for_healthy de_superset 300

            echo "Deployment completed successfully."
