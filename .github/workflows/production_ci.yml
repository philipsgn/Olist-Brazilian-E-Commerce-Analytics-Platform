name: Production Data Pipeline CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-test:
    name: CI - Lint and dbt Compile
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: de_user
          POSTGRES_PASSWORD: de_password
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_PROFILES_DIR: ./dbt_project
      RDS_HOST: localhost
      RDS_USER: de_user
      DBT_ENV_SECRET_RDS_PASSWORD: de_password
      RDS_DBNAME: ecommerce_db
      ENVIRONMENT: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install SQL Linting Dependencies
        run: pip install sqlfluff sqlfluff-templater-dbt

      - name: SQL Linting
        run: sqlfluff lint dbt_project/ecommerce/models --dialect postgres

      - name: Install dbt Dependencies
        run: |
          pip install dbt-core dbt-postgres
          dbt deps --project-dir ./dbt_project/ecommerce

      - name: dbt Debug
        run: dbt debug --project-dir ./dbt_project/ecommerce --target dev

      - name: dbt Compile
        run: dbt compile --project-dir ./dbt_project/ecommerce --target dev

      - name: dbt Seed
        run: dbt seed --project-dir ./dbt_project/ecommerce --target dev || echo "No seeds found, skipping."

  deploy:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Project
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='secrets' \
            --exclude='logs' \
            --exclude='airflow/logs' \
            --exclude='dbt_project/ecommerce/logs' \
            --exclude='dbt_project/ecommerce/target' \
            --exclude='dbt_project/ecommerce/dbt_packages' \
            --exclude='postgres_data' \
            --exclude='tmp' \
            --exclude='*.checkpoint' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            .

          mv /tmp/deploy.tar.gz .

      - name: Sync Archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.EC2_USER }}/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            echo "Deploy script version: 2026-04-23.8"

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/Olist-Brazilian-E-Commerce-Analytics-Platform"
            echo "Setting up project directory: $PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"

            echo "Extracting files..."
            sudo tar -xzf "/home/${{ secrets.EC2_USER }}/deploy.tar.gz" -C "$PROJECT_DIR" --overwrite
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} "$PROJECT_DIR"
            rm "/home/${{ secrets.EC2_USER }}/deploy.tar.gz"

            cd "$PROJECT_DIR"

            echo "Verifying docker-compose.yml exists..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found in $PROJECT_DIR"
              exit 1
            fi

            echo "Verifying .env file exists..."
            if [ ! -f ".env" ]; then
              echo "ERROR: .env file not found. Please create it manually on EC2."
              exit 1
            fi

            if ! sudo test -r ".env"; then
              echo "ERROR: .env exists but is not readable by the current deploy user."
              echo "Current file details:"
              ls -l .env || true
              sudo ls -l .env || true
              exit 1
            fi

            echo "Normalizing .env for Docker networking and host port bindings..."
            echo "Current .env file details before update:"
            sudo ls -l .env || true
            sudo python3 -c "from pathlib import Path; p=Path('.env'); updates={'POSTGRES_PORT':'5432','POSTGRES_HOST_PORT':'5433','POSTGRES_BIND_ADDRESS':'127.0.0.1','AIRFLOW_WEBSERVER_HOST_PORT':'8080','AIRFLOW_BIND_ADDRESS':'0.0.0.0','SUPERSET_HOST_PORT':'8088','SUPERSET_BIND_ADDRESS':'0.0.0.0'}; lines=p.read_text(encoding='utf-8').splitlines(); kept=[line for line in lines if not any(line.startswith(f'{k}=') for k in updates)]; kept.extend(f'{k}={v}' for k,v in updates.items()); p.write_text('\n'.join(kept)+'\n', encoding='utf-8')"

            echo "Resolved port-related values from .env:"
            sudo grep -E '^(POSTGRES_PORT|POSTGRES_HOST_PORT|POSTGRES_BIND_ADDRESS|AIRFLOW_WEBSERVER_HOST_PORT|AIRFLOW_BIND_ADDRESS|SUPERSET_HOST_PORT|SUPERSET_BIND_ADDRESS)=' .env || true

            echo "Checking whether host port 8088 is safe to use for Superset..."
            EXISTING_SUPERSET_CONTAINER="$(sudo docker ps --filter publish=8088 --format '{{.Names}}' || true)"
            if [ -n "$EXISTING_SUPERSET_CONTAINER" ]; then
              if [ "$EXISTING_SUPERSET_CONTAINER" = "de_superset" ]; then
                echo "Found previous de_superset container on port 8088. Removing it before deploy..."
                sudo docker rm -f de_superset || true
              else
                echo "ERROR: host port 8088 is already published by another container: $EXISTING_SUPERSET_CONTAINER"
                echo "Refusing to stop unrelated container. Please free port 8088 on EC2 and rerun deploy."
                exit 1
              fi
            fi

            if sudo ss -ltnp | grep -q ':8088 '; then
              echo "ERROR: host port 8088 is being used by a non-stack process on EC2."
              echo "Listener details:"
              sudo ss -ltnp | grep ':8088 ' || true
              exit 1
            fi

            echo "Pulling latest images and rebuilding containers..."
            sudo docker compose pull --quiet || true

            echo "Stopping conflicting native PostgreSQL service if present..."
            sudo systemctl stop postgresql || true

            echo "Cleaning up previous containers..."
            sudo docker compose down --remove-orphans || true
            sudo docker rm -f \
              de_postgres \
              de_redis \
              de_airflow_webserver \
              de_airflow_scheduler \
              de_airflow_worker \
              de_superset \
              olist-brazilian-e-commerce-analytics-platform-airflow-common-1 || true

            echo "Starting updated stack..."
            sudo docker compose up -d --build --remove-orphans

            echo "Waiting 15s for services to stabilize..."
            sleep 15

            echo "Current container status:"
            sudo docker compose ps

            echo "Deployment complete."

      - name: Notify Discord - Deploy Success
        if: success()
        uses: appleboy/discord-action@v1.0.0
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "3066993"
          username: "GitHub Actions Bot"
          message: |
            Deploy SUCCESS - `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Triggered by: `${{ github.actor }}`
            Commit: ${{ github.event.head_commit.message }}
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Discord - Deploy Failed
        if: failure()
        uses: appleboy/discord-action@v1.0.0
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "15158332"
          username: "GitHub Actions Bot"
          message: |
            Deploy FAILED - `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Triggered by: `${{ github.actor }}`
            Commit: ${{ github.event.head_commit.message }}
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
