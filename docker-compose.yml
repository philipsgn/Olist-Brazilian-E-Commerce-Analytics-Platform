x-service-defaults: &service-defaults
  restart: always
  security_opt:
    # AppArmor may block bind-mounted paths on hardened EC2 hosts during CI/CD deploys.
    - apparmor:unconfined

x-airflow-common: &airflow-common
  <<: *service-defaults
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_AIRFLOW_DB:-airflow}"
    AIRFLOW__CELERY__BROKER_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0"
    AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_AIRFLOW_DB:-airflow}"
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
    POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
    POSTGRES_USER: "${POSTGRES_USER:-de_user}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-de_password}"
    POSTGRES_DB: "${POSTGRES_DB:-ecommerce_db}"
    POSTGRES_AIRFLOW_DB: "${POSTGRES_AIRFLOW_DB:-airflow}"
    POSTGRES_SUPERSET_DB: "${POSTGRES_SUPERSET_DB:-superset}"
    RDS_HOST: "${RDS_HOST:-postgres}"
    RDS_PORT: "${RDS_PORT:-5432}"
    RDS_USER: "${RDS_USER:-de_user}"
    RDS_PASSWORD: "${RDS_PASSWORD:-de_password}"
    RDS_DB: "${RDS_DB:-ecommerce_db}"
    PYTHONPATH: "${PYTHONPATH:-/opt/airflow}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/utils:/opt/airflow/utils
    - ./data:/opt/airflow/data
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - ./scripts:/opt/airflow/scripts
    - ./analytics:/opt/airflow/analytics
    - ./tmp:/opt/airflow/tmp
    - ./certs:/opt/airflow/certs:ro
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    postgres-bootstrap:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # One-shot init: filesystem permissions for Airflow bind mounts (host ↔ container UID)
  # ---------------------------------------------------------------------------
  airflow-init:
    image: ubuntu:22.04  # 🔴 SỬA TẠI ĐÂY: Đổi từ Alpine sang Ubuntu để có sẵn /bin/bash
    container_name: de_airflow_init
    user: root
    restart: "no"
    environment:
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
      AIRFLOW_GID: "${AIRFLOW_GID:-0}"
    volumes:
      - ./scripts/init/airflow-init.sh:/init/airflow-init.sh:ro
      - ./airflow/dags:/mnt/airflow/dags
      - ./airflow/logs:/mnt/airflow/logs
      - ./airflow/plugins:/mnt/airflow/plugins
      - ./airflow/utils:/mnt/airflow/utils
      - ./data:/mnt/data
      - ./ingestion:/mnt/ingestion
      - ./dbt_project:/mnt/dbt_project
      - ./scripts:/mnt/scripts
      - ./analytics:/mnt/analytics
      - ./tmp:/mnt/tmp
      - ./certs:/mnt/certs:ro
    entrypoint: ["/bin/bash", "-c", "sed 's/\r$//' /init/airflow-init.sh | bash"]

  # ---------------------------------------------------------------------------
  # One-shot init: idempotent CREATE DATABASE for Airflow/Superset metadata (local Postgres or RDS)
  # ---------------------------------------------------------------------------
  postgres-bootstrap:
    # 🔴 SỬA TẠI ĐÂY: Sử dụng image chứa postgres-client trên nền Debian để cài sẵn bash và lệnh psql công nghiệp
    image: postgres:15  
    container_name: de_postgres_bootstrap
    user: root
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-de_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-de_password}"
      POSTGRES_AIRFLOW_DB: "${POSTGRES_AIRFLOW_DB:-airflow}"
      POSTGRES_SUPERSET_DB: "${POSTGRES_SUPERSET_DB:-superset}"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-prefer}"
      PGSSLMODE: "${POSTGRES_SSLMODE:-prefer}"
    volumes:
      - ./scripts/init/ensure_postgres_databases.sh:/init/ensure_postgres_databases.sh:ro
    entrypoint: ["/bin/bash", "-c", "sed 's/\r$//' /init/ensure_postgres_databases.sh | bash"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ---------------------------------------------------------------------------
  # One-shot init: ownership for Superset named volume (apache/superset runs as UID 1000)
  # ---------------------------------------------------------------------------
  superset-init:
    image: ubuntu:22.04  # 🔴 SỬA TẠI ĐÂY: Đổi từ Alpine sang Ubuntu để có sẵn /bin/bash
    container_name: de_superset_init
    user: root
    restart: "no"
    environment:
      SUPERSET_UID: "${SUPERSET_UID:-1000}"
      SUPERSET_GID: "${SUPERSET_GID:-1000}"
    volumes:
      - ./scripts/init/superset-init.sh:/init/superset-init.sh:ro
      - superset_home:/app/superset_home
    entrypoint: ["/bin/bash", "-c", "sed 's/\r$//' /init/superset-init.sh | bash"]

  postgres:
    <<: *service-defaults
    image: postgres:15
    container_name: de_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-de_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-de_password}"
      POSTGRES_DB: "${POSTGRES_DB:-ecommerce_db}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_user} -d ${POSTGRES_DB:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: de_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-webserver:
    <<: *airflow-common
    container_name: de_airflow_webserver
    ports:
      - "${AIRFLOW_BIND_ADDRESS:-0.0.0.0}:${AIRFLOW_WEBSERVER_HOST_PORT:-8080}:8080"
    command: >
      bash -c "/opt/airflow/scripts/validate_rds_env.sh &&
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL}
      --password ${AIRFLOW_ADMIN_PASSWORD} || true &&
      exec airflow webserver"
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/airflow/certs/global-bundle.pem && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: de_airflow_scheduler
    command: "bash -c '/opt/airflow/scripts/validate_rds_env.sh && exec airflow scheduler'"
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/airflow/certs/global-bundle.pem && AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  airflow-worker:
    <<: *airflow-common
    container_name: de_airflow_worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-bootstrap:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    command: "bash -c '/opt/airflow/scripts/validate_rds_env.sh && exec airflow celery worker'"
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/airflow/certs/global-bundle.pem && celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  superset:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.superset
    image: olist-brazilian-ecommerce-superset:4.0.2
    container_name: de_superset
    env_file:
      - .env
    ports:
      # Match hoàn toàn với biến môi trường: Cổng ngoài (8090) -> Cổng trong container (8088)
      - "${SUPERSET_BIND_ADDRESS:-0.0.0.0}:${SUPERSET_HOST_PORT:-8090}:${SUPERSET_PORT:-8088}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD}"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-de_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-de_password}"
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://${POSTGRES_USER:-de_user}:${POSTGRES_PASSWORD:-de_password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_SUPERSET_DB:-superset}"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    # 🔴 ĐIỂM SỬA 1: Gunicorn lắng nghe động theo biến ${SUPERSET_PORT} (tức là 8088)
    command: >
      bash -c "exec gunicorn -w 2 --timeout 120 -b 0.0.0.0:${SUPERSET_PORT:-8088} --limit-request-line 0 --limit-request-field_size 0 \"superset.app:create_app()\""
    # 🔴 ĐIỂM SỬA 2: Lệnh Healthcheck tự động gọi vào đúng cổng nội bộ ${SUPERSET_PORT} qua biến môi trường
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port = os.getenv('SUPERSET_PORT', '8088'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  superset_home: